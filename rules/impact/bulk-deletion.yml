id: impact-bulk-deletion-001
title: Bulk file deletion burst
description: |
  core/deletions.py emits one synthetic `file_delete_burst` event when 20 or
  more deletions by the same method (Recycle Bin, USN journal) fall inside a
  120-second window. A human emptying a folder, a wiper, ransomware staging,
  or a cleanup tool all look like this; the event carries the count, window,
  method, the attributed user (with its confidence) and up to ten sample
  paths so the examiner can tell them apart. MFT upper-bound times are not
  used for bursts because they cluster on last-write, not on deletion.
severity: high
mitre:
  techniques: [T1485]
  tactics: [impact]
references:
  - https://attack.mitre.org/techniques/T1485/
author: dft
date: 2026-10-27

match:
  event_type: file_delete_burst
