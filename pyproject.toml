[project]
name = "dft-core"
version = "0.1.0"
description = "Digital Forensics Triage Toolkit — parsing core and sidecar"
requires-python = ">=3.11"
dependencies = [
    "regipy>=5.0.0",
    "libfwsi-python>=20240000",
    "python-evtx>=0.8.0",
    "libscca-python>=20240000",
    "libmsiecf-python>=20240000",
    "pyyaml>=6.0",
    "dissect.target>=3.20",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "collectors*", "parsers*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "RUF", # ruff
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
